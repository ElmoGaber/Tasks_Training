<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Shop</h1>
        
        <div class="product-grid">
            <div class="product-card">
                <h3>Product 1</h3>
                <p>$29.99</p>
                <button class="add-cart-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Product 2</h3>
                <p>$49.99</p>
                <button class="add-cart-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Product 3</h3>
                <p>$19.99</p>
                <button class="add-cart-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Product 4</h3>
                <p>$39.99</p>
                <button class="add-cart-btn">Add to Cart</button>
            </div>
        </div>
        
        <div id="cart-summary" class="cart-summary hidden">
            <h2>Cart Summary</h2>
            <ul id="cart-items"></ul>
            <div class="total">
                <span>Total:</span>
                <span id="total-amount">$0.00</span>
            </div>
            <button id="checkout-btn">Checkout</button>
        </div>
        
        <div class="theme-toggle" id="themeToggle">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.285 21.285a1.975 1.975 0 0 1-2.828 0l-8.408-8.398-8.398 8.408a1.975 1.975 0 0 1-2.828-2.828l8.576-8.575 8.576 8.575a1.975 1.975 0 0 1 0 2.828zM5.216 5.216a4.001 4.001 0 0 0 0 5.657l5.35 5.35a4.001 4.001 0 0 0 5.657 0l5.351-5.35a4.001 4.001 0 0 0-5.657-5.657l-5.35 5.351zm10.688-2.227a3.997 3.997 0 0 1 0 5.655l-5.351 5.35a3.997 3.997 0 0 1-5.657 0l-5.351-5.35a3.997 3.997 0 0 1 5.657 0z"/>
            </svg>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
